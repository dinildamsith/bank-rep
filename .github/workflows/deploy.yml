name: Deploy Flask App to AWS EC2

on:
  push:
    branches:
      - REALASE

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa  # Make sure permissions are correct

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/flask-app:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/flask-app:latest

      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            sudo docker stop flask-container || true
            sudo docker rm flask-container || true
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/flask-app:latest
            sudo docker run -d -p 5000:5000 --name flask-container ${{ secrets.DOCKER_HUB_USERNAME }}/flask-app:latest
